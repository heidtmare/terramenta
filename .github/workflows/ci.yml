name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Linux deps (Bevy winit/x11/wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libasound2-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      # Kernels, EOP, space weather, EGM2008 120×120. Without them the GMAT and
      # Horizons suites skip, so fetch failure fails the job.
      - uses: actions/cache@v4
        with:
          path: terramenta-solare/data
          key: solare-data-${{ hashFiles('terramenta-solare/scripts/fetch-data.sh') }}
      - run: terramenta-solare/scripts/fetch-data.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo clippy -p terramenta-globe -p terramenta-charta --lib --target wasm32-unknown-unknown --locked
      - run: cargo test --workspace --locked

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terramenta-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm test
