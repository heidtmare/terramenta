<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Terramenta</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #cfe0ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: var(--ink);
      }
      /* Bevy sizes the canvas to this element via `fit_canvas_to_parent`. */
      #canvas-container {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        text-align: center;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: opacity 0.4s ease;
      }
      #status[hidden] {
        display: none;
      }
      #status.faded {
        opacity: 0;
      }
      #status h1 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.35em;
      }
      #status p {
        margin: 0;
        opacity: 0.6;
        max-width: 34rem;
        line-height: 1.7;
        text-transform: none;
        letter-spacing: normal;
      }
      #status a {
        color: inherit;
      }
      .spinner {
        width: 1.5rem;
        height: 1.5rem;
        margin: 0 auto;
        border: 1px solid rgba(207, 224, 255, 0.25);
        border-top-color: var(--ink);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="canvas-container">
      <canvas id="terramenta"></canvas>
    </div>

    <div id="status">
      <h1>TERRAMENTA</h1>
      <div class="spinner"></div>
      <p id="status-message">Loading…</p>
    </div>

    <script type="module">
      const status = document.getElementById("status");
      const message = document.getElementById("status-message");

      const fail = (text) => {
        status.classList.remove("faded");
        status.hidden = false;
        status.querySelector(".spinner").remove();
        message.innerHTML = text;
      };

      if (!navigator.gpu) {
        fail(
          "This build renders through <strong>WebGPU</strong>, which this browser " +
            "does not expose. Try Chrome or Edge 113+, Safari 26+, or Firefox 141+ " +
            "(on Linux, Firefox still needs <code>dom.webgpu.enabled</code>).",
        );
      } else {
        try {
          const { default: init } = await import("./terramenta.js");
          await init();
          // The first frame lands a moment after init resolves; fade out over it.
          setTimeout(() => {
            status.classList.add("faded");
            setTimeout(() => (status.hidden = true), 400);
          }, 300);
        } catch (error) {
          // Winit unwinds through an exception to hand control to the browser's
          // event loop, which surfaces here as a benign "unreachable" throw.
          if (!`${error}`.includes("Using exceptions for control flow")) {
            console.error(error);
            fail(`Failed to start: <code>${error}</code>`);
          } else {
            status.hidden = true;
          }
        }
      }
    </script>
  </body>
</html>
