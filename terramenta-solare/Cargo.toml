[package]
name = "terramenta-solare"
description = "A hierarchical solar-system reference frame tree, rooted at the Solar System Barycenter"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "terramenta_solare"

[dependencies]
# Position and velocity vectors. `DVec3` throughout: `terramenta-globe` narrows
# to `f32` because it draws a unit sphere a few metres across, but a
# barycentric position is on the order of 10^8 km, where an `f32` has less
# precision than a house.
glam = { version = "0.32", default-features = false, features = ["std"] }
# Time scales and leap seconds.
hifitime = { version = "4.3.1", default-features = false, features = ["std"] }
# SOFA: precession, nutation, sidereal time, polar motion.
sofars = "0.6.1"
# SPICE kernels (DE440). `metaload`/`analysis` pull in networking and rayon; not WASM-safe.
anise = { version = "=0.10.6", default-features = false }
bytes = "1.6"
# SGP4/SDP4 (TLE/OMM), pure Rust, wasm32-safe. Same version as terramenta-globe.
sgp4 = "2.4.0"
