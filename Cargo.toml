[package]
name = "terramenta"
version = "0.1.0"
edition = "2024"
description = "A navigable 3D globe of Earth, rendered with Bevy and WebGPU"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_light",
    "bevy_material",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_render",
    "bevy_shader",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "bevy_log",
    "default_font",
    "gestures",
    "hdr",
    "jpeg",
    "keyboard",
    "ktx2",
    "mouse",
    "png",
    "tonemapping_luts",
    "touch",
    # Pure-Rust zstd: the C implementation cannot link on wasm32, and this is
    # only used to unpack the tonemapping LUT once at startup.
    "zstd_rust",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "multi_threaded",
    "wayland",
    "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "web",
    "webgpu",
] }
# `std::time::SystemTime` is unimplemented on wasm32-unknown-unknown; this shim
# reads the wall clock from JS so the globe can start at the real UTC time.
web-time = "1.1"

# Debug builds of a renderer are unusably slow without optimized dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

# Size-oriented profile used by `scripts/build-web.sh --release`.
[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
