# Terramenta is a workspace of two halves: the globe renderer, which compiles to
# a WebAssembly module with a JavaScript control surface, and the web app that
# embeds it.
#
# `terramenta-webapp` is not a Cargo member — it is plain HTML, CSS and ES
# modules with no build step. See `terramenta-webapp/README.md`.
[workspace]
resolver = "3"
members = ["terramenta-globe", "terramenta-solare", "terramenta-charta"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Debug builds of a renderer are unusably slow without optimized dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

# Size-oriented profile used by `terramenta-globe/scripts/build-wasm.sh --release`.
[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
